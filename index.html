<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guias de Estudio — Dev</title>
    <link rel="stylesheet" href="shared/styles.css" />
    <style>
      .landing-header {
        text-align: center;
        padding: 40px 0 20px;
      }
      .landing-header h1 {
        border: none;
        font-size: 28px;
        margin: 0;
      }
      .landing-header p {
        color: var(--text-muted);
        font-size: 15px;
        margin-top: 8px;
      }
      .guides-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }
      .guide-card {
        background: var(--bg-surface);
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        transition: border-color 0.2s, transform 0.2s;
        text-decoration: none;
        color: var(--text);
        display: block;
      }
      .guide-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        text-decoration: none;
      }
      .guide-card h2 {
        margin: 0 0 8px;
        font-size: 18px;
        color: var(--h1);
      }
      .guide-card p {
        margin: 0 0 12px;
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .guide-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .guide-status {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 10px;
      }
      .guide-status.active {
        background: #2e7d32;
        color: #fff;
      }
      .guide-status.soon {
        background: var(--border);
        color: var(--text-muted);
      }
      .landing-theme {
        position: absolute;
        top: 20px;
        right: 20px;
      }
    </style>
  </head>
  <body style="position: relative">
    <button
      class="theme-toggle landing-theme"
      id="themeToggle"
      title="Cambiar tema"
    ></button>

    <div class="landing-header">
      <h1>Guias de Estudio</h1>
      <p>
        Planes estructurados con progreso interactivo. Elegí una guía y empeza.
      </p>
    </div>

    <div class="guides-grid">
      <a href="fullstack-2026/" class="guide-card">
        <span class="guide-status active">Disponible</span>
        <h2>Fullstack Web 2026</h2>
        <p>
          HTML5, CSS3, Tailwind v4, JavaScript, React 19, Django 6 y proyecto
          final. 6 semanas de plan estructurado.
        </p>
        <div class="guide-tags">
          <span class="tg">HTML</span>
          <span class="tg">CSS</span>
          <span class="tg">Tailwind</span>
          <span class="tg">JavaScript</span>
          <span class="tg">React 19</span>
          <span class="tg">Django 6</span>
        </div>
      </a>

      <!-- Futuras guias: copiar el bloque de arriba y cambiar datos -->
    </div>

    <script src="shared/app.js"></script>
  </body>
</html>
